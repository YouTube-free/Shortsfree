<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="style.css"/>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <!-- ── iOS / Apple Home Screen ── -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="YouTune"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>

  <!-- ── PWA Manifest ── -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#FF2D55"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- ── Open Graph ── -->
  <meta property="og:title" content="YouTune"/>
  <meta property="og:description" content="Minimalistische YouTube-ervaring"/>
  <meta property="og:image" content="og-image.svg"/>
  <meta property="og:type" content="website"/>
</head>
<body>

<!-- ═══════════════════════════ SIDEBAR ═══════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <rect width="30" height="30" rx="9" fill="#FF2D55"/>
      <path d="M12 9.5L21 15L12 20.5V9.5Z" fill="white"/>
    </svg>
    <span class="logo-text">YouTune</span>
  </div>

  <nav class="sidebar-nav">
    <a href="#" class="nav-item active" data-view="home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item" data-view="subscriptions">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span>Abonnementen</span>
      <span class="nav-badge" id="sub-badge"></span>
    </a>
    <a href="#" class="nav-item" data-view="saved">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      <span>Opgeslagen</span>
      <span class="nav-badge" id="saved-badge"></span>
    </a>
  </nav>

  <div class="sidebar-divider" id="sb-divider" style="display:none"></div>
  <p class="sidebar-section-lbl" id="sb-ch-label" style="display:none">Kanalen</p>
  <div class="sidebar-channels" id="sidebar-channels"></div>
</aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ═══════════════════════════ MAIN ═══════════════════════════ -->
<main class="main">

  <!-- TOPBAR -->
  <header class="topbar">
    <button class="menu-btn" id="menu-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="search-area">
      <div class="search-toggle" id="search-toggle">
        <button class="stoggle-btn active" data-type="video">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Video's
        </button>
        <button class="stoggle-btn" data-type="channel">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Kanalen
        </button>
      </div>
      <div class="search-bar">
        <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Zoek video's…" autocomplete="off" spellcheck="false"/>
        <button id="search-btn" class="search-go">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <span class="api-live" title="YouTube API verbonden"></span>
  </header>

  <!-- ─── HOME ─── -->
  <div class="view active" id="view-home">
    <div class="view-hdr"><h1 class="view-title">Home</h1></div>
    <div id="home-content"></div>
  </div>

  <!-- ─── SUBSCRIPTIONS ─── -->
  <div class="view" id="view-subscriptions">
    <div class="view-hdr">
      <h1 class="view-title">Abonnementen</h1>
      <p class="view-sub" id="subs-sub">Beheer je kanalen</p>
    </div>
    <div class="channels-grid" id="subs-grid"></div>
  </div>

  <!-- ─── SAVED ─── -->
  <div class="view" id="view-saved">
    <div class="view-hdr">
      <h1 class="view-title">Opgeslagen</h1>
      <p class="view-sub" id="saved-sub">Je bewaarde video's</p>
    </div>
    <div class="video-grid" id="saved-grid"></div>
  </div>

  <!-- ─── SEARCH RESULTS ─── -->
  <div class="view" id="view-search">
    <div class="view-hdr">
      <button class="back-btn" id="search-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div>
        <h1 class="view-title" id="search-title">Zoeken</h1>
        <p class="view-sub" id="search-sub"></p>
      </div>
    </div>
    <div id="search-content"></div>
  </div>

  <!-- ─── CHANNEL DETAIL ─── -->
  <div class="view" id="view-channel">
    <div id="channel-content"></div>
  </div>

</main>

<!-- ═══════════════════════════ VIDEO MODAL ═══════════════════════════ -->
<div class="modal" id="modal">
  <div class="modal-bg" id="modal-bg"></div>
  <div class="modal-box">
    <button class="modal-close" id="modal-close">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-player" id="modal-player"></div>
    <div class="modal-info" id="modal-info"></div>
  </div>
</div>

<!-- ═══════════════════════════ TOASTS ═══════════════════════════ -->
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
